[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "danishaft-reaper-mcp"
version = "0.1.0"
description = "Guarded MCP control of REAPER through a local Lua bridge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["audio", "daw", "mcp", "music-production", "reaper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "mcp>=1.0.0,<2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "starlette>=0.37.0",
  "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/danishaft/reaper-mcp"
Documentation = "https://github.com/danishaft/reaper-mcp#readme"
Issues = "https://github.com/danishaft/reaper-mcp/issues"
Repository = "https://github.com/danishaft/reaper-mcp"

[project.scripts]
reaper-mcp = "reaper_mcp.server:main"
reaper-mcp-cli = "reaper_mcp.cli:main"
reaper-mcp-install = "reaper_mcp.install:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reaper_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"lua/reaper_mcp_bridge.lua" = "reaper_mcp/resources/reaper_mcp_bridge.lua"
"lua/reaper_mcp_bridge_modules" = "reaper_mcp/resources/reaper_mcp_bridge_modules"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
