name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing semantic version tag, for example v0.1.1"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  package:
    name: Build release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build source and wheel distributions
        run: uv build

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          package_version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/

  publish-pypi:
    name: Publish Python package
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: pypi
      url: https://pypi.org/p/danishaft-reaper-mcp
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-github:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [package, publish-pypi]
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist/

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-prerelease: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=${{ inputs.prerelease || false }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: REAPER MCP ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          files: dist/*
